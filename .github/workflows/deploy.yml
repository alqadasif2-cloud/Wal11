name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build Web Assets & Check GitHub Pages
    runs-on: ubuntu-24.04
    outputs:
      pages_ready: ${{ steps.pages_state.outputs.ready }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Auto-Verify & Sync Firebase Configuration
        run: |
          node scripts/sync-firebase-config.mjs

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Application
        run: |
          npx vite build --base=./
        env:
          NODE_ENV: production

      - name: Check if GitHub Pages is Enabled on Repository
        id: check_pages
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/pages_site.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ GitHub Pages is enabled on this repository."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ GitHub Pages is not enabled on this repository (HTTP $HTTP_STATUS). Skipping Pages deployment cleanly."
          fi

      - name: Configure Pages
        id: configure_pages
        if: steps.check_pages.outputs.exists == 'true'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Set Pages Readiness Output
        id: pages_state
        run: |
          if [ "${{ steps.check_pages.outputs.exists }}" = "true" ] && [ "${{ steps.configure_pages.outcome }}" = "success" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### ℹ️ GitHub Pages Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "تم بناء ملفات الويب بنجاح، وتم تخطي النشر إلى GitHub Pages تلقائياً لأن ميزة Pages غير مفعّلة في إعدادات المستودع (\`Settings -> Pages -> Source: GitHub Actions\`)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Pages Artifact
        if: steps.pages_state.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
