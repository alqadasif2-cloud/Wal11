name: CI Build & Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build Application
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Auto-Verify & Sync Firebase Configuration
        run: |
          node scripts/sync-firebase-config.mjs

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Run Type Check & Lint
        run: |
          npx tsc --noEmit

      - name: Build Production Assets
        run: |
          npx vite build --base=./
        env:
          NODE_ENV: production

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 7
