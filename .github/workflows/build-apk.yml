name: Build Android APK (v1.0.1)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_PACKAGE_ID: com.trustwallet.pro
  APP_VERSION_NAME: 1.0.1
  APP_VERSION_CODE: '2'
  APK_FILE_NAME: TRUST-WALLET-1.0.1.apk

jobs:
  build-apk:
    name: Build & Verify TRUST-WALLET-1.0.1.apk
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Auto-Verify & Sync Firebase Configuration
        run: |
          node scripts/sync-firebase-config.mjs

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Assets
        run: |
          npx vite build --base=./
        env:
          NODE_ENV: production

      - name: Prepare Capacitor Android Project (Preserve Package ID, Version & Icons)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

          # Backup repository Android customizations (build.gradle with versionCode 2 / 1.0.1, manifest, icons, keystores)
          mkdir -p /tmp/android_preserved
          if [ -f "android/app/build.gradle" ]; then
            cp android/app/build.gradle /tmp/android_preserved/app_build.gradle
          fi
          if [ -f "android/build.gradle" ]; then
            cp android/build.gradle /tmp/android_preserved/root_build.gradle
          fi
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/android_preserved/AndroidManifest.xml
          fi
          if [ -d "android/app/src/main/res" ]; then
            cp -r android/app/src/main/res /tmp/android_preserved/res
          fi
          for kf in signing.keystore debug.keystore google-services.json; do
            if [ -f "android/app/$kf" ]; then
              cp "android/app/$kf" "/tmp/android_preserved/$kf"
            fi
          done

          # Generate complete Capacitor Android scaffold including gradlew & variables.gradle
          rm -rf android
          npx -y @capacitor/cli add android

          # Restore preserved app/build.gradle (versionCode 2 / 1.0.1 / com.trustwallet.pro), manifest, and app icons
          if [ -f "/tmp/android_preserved/app_build.gradle" ]; then
            cp /tmp/android_preserved/app_build.gradle android/app/build.gradle
          fi
          node -e '
            const fs = require("fs");
            const p = "android/build.gradle";
            if (fs.existsSync(p)) {
              let c = fs.readFileSync(p, "utf8");
              if (!c.includes("com.google.gms:google-services")) {
                c = c.replace(/dependencies\s*\{/, "dependencies {\n        classpath \x27com.google.gms:google-services:4.4.4\x27");
                fs.writeFileSync(p, c, "utf8");
              }
            }
          '
          if [ -f "/tmp/android_preserved/AndroidManifest.xml" ]; then
            cp /tmp/android_preserved/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -d "/tmp/android_preserved/res" ]; then
            cp -r /tmp/android_preserved/res/* android/app/src/main/res/
          fi
          for kf in signing.keystore debug.keystore google-services.json; do
            if [ -f "/tmp/android_preserved/$kf" ]; then
              cp "/tmp/android_preserved/$kf" "android/app/$kf"
            fi
          done

          # Sync Firebase config & Web assets into Android project without overwriting build.gradle
          node scripts/sync-firebase-config.mjs
          npx -y @capacitor/cli sync android

          # Enforce exact applicationId, versionCode 2, versionName 1.0.1, and zero applicationIdSuffix
          grep -q 'applicationId "com.trustwallet.pro"' android/app/build.gradle
          grep -q 'versionCode 2' android/app/build.gradle
          grep -q 'versionName "1.0.1"' android/app/build.gradle

      - name: Configure Original Signing Keystore (If Provided)
        id: signing_check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > android/app/signing.keystore
            echo "mode=release_signed" >> $GITHUB_OUTPUT
            echo "✅ Original release keystore loaded from GitHub Secrets."
          elif [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > android/app/debug.keystore
            echo "mode=debug_consistent" >> $GITHUB_OUTPUT
            echo "✅ Original debug.keystore loaded from GitHub Secrets."
          elif [ -f "android/app/signing.keystore" ] || [ -f "android/app/debug.keystore" ]; then
            echo "mode=repo_keystore" >> $GITHUB_OUTPUT
            echo "✅ Existing keystore found in android/app/."
          else
            echo "mode=ephemeral_debug" >> $GITHUB_OUTPUT
            echo "⚠️ WARNING: No signing keystore from v1.0.0 was found in Secrets or repository."
          fi

      - name: Build Android APK (v1.0.1 / versionCode 2)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ steps.signing_check.outputs.mode }}" = "release_signed" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Package & Verify Internal APK Metadata (TRUST-WALLET-1.0.1.apk)
        run: |
          mkdir -p output-apk
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "output-apk/${APK_FILE_NAME}"
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "output-apk/${APK_FILE_NAME}"
          else
            FOUND_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
            cp "$FOUND_APK" "output-apk/${APK_FILE_NAME}"
          fi

          ls -lh "output-apk/${APK_FILE_NAME}"

          # Verify internal binary AndroidManifest metadata using Android SDK aapt2
          AAPT2_BIN=$(find "$ANDROID_HOME/build-tools" -name "aapt2" | sort -V | tail -n 1)
          if [ -n "$AAPT2_BIN" ]; then
            BADGING=$("$AAPT2_BIN" dump badging "output-apk/${APK_FILE_NAME}" | head -n 5)
            echo "$BADGING"
            echo "$BADGING" | grep -q "name='com.trustwallet.pro'"
            echo "$BADGING" | grep -q "versionCode='2'"
            echo "$BADGING" | grep -q "versionName='1.0.1'"
            echo "✅ Verified internal APK binary metadata: com.trustwallet.pro | versionCode=2 | versionName=1.0.1"
          fi

      - name: Upload TRUST-WALLET-1.0.1.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRUST-WALLET-1.0.1.apk
          path: output-apk/TRUST-WALLET-1.0.1.apk
          retention-days: 30

      - name: Build Summary
        run: |
          echo "### 📦 TRUST-WALLET-1.0.1.apk" >> $GITHUB_STEP_SUMMARY
          echo "- **Application ID:** \`com.trustwallet.pro\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Name:** \`1.0.1\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code:** \`2\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.signing_check.outputs.mode }}" = "ephemeral_debug" ]; then
            echo "- **حالة التوقيع (Signing):** ⚠️ لم يتم العثور على شهادة توقيع الإصدار السابق (Keystore) في Secrets أو المشروع؛ تم البناء بتوقيع تصحيح مؤقت. لتثبيت التحديث فوق النسخة السابقة دون تعارض، أضف مفتاح التوقيع الأصلي في GitHub Secrets." >> $GITHUB_STEP_SUMMARY
          else
            echo "- **حالة التوقيع (Signing):** ✅ تم التوقيع باستخدام شهادة المفتاح المحددة والمتوافقة مع الترقية المباشرة." >> $GITHUB_STEP_SUMMARY
          fi
